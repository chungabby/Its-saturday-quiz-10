<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What do you need right now?｜It’s Saturday!</title>
<meta name="description" content="花兩分鐘，看看最近的生活需要什麼吧。">
<meta name="theme-color" content="#EDEBE8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEBE8;
  --ink:#3D2A0C;
  --ink-soft:#634F42;
  --ink-mute:#8E8378;
  --line:rgba(61,42,12,.18);
  --tan-text:#B79972;
  --clay:#997458;
  --green:#56844E;
  --red:#A14545;
  --sand:#EEE4D7;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --en:"Faculty Glyphic",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --veil:68px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{
  color:var(--ink);font-family:var(--zh);font-weight:400;font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100svh;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p,ul,figure{margin:0;padding:0;font-weight:400}
ul{list-style:none}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
[data-focus]:focus,[data-focus]:focus-visible{outline:none}
.en{font-family:var(--en);font-weight:400}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- screen switching ---------- */
.screen{opacity:1;transition:opacity .36s ease}
.screen.is-leaving,.screen.is-entering{opacity:0}

/* ---------- fixed chrome (Q1 → Result) ---------- */
.close{
  position:absolute;z-index:30;top:calc(var(--safe-t) + 22px);right:22px;
  font-size:12px;letter-spacing:.1em;line-height:1.4;color:var(--ink-soft);text-decoration:none;
  padding:2px 2px 5px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.close:hover{color:var(--ink);border-bottom-color:var(--ink)}
.sound{
  position:fixed;z-index:30;top:calc(var(--safe-t) + 14px);left:14px;width:36px;height:36px;
  display:grid;place-items:center;color:var(--ink-soft);
}
.sound:hover{color:var(--ink)}
.sound svg{width:17px;height:17px}
.sound[aria-pressed="true"] .sound__off,.sound[aria-pressed="false"] .sound__on{display:none}
body[data-screen="home"] .sound{display:none}
.veil{
  position:fixed;z-index:10;left:0;right:0;bottom:0;pointer-events:none;
  height:calc(var(--veil) + var(--safe-b));
  background:linear-gradient(to bottom,rgba(237,235,232,0) 0%,rgba(237,235,232,.86) 52%,#EDEBE8 82%);
}
.logo{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 16px);width:108px;pointer-events:none;
}
.logo img{width:100%;height:auto}
body[data-screen="home"] .close,
body[data-screen="home"] .veil,
body[data-screen="home"] .logo{display:none}

/* ---------- home ---------- */
.home{
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:clamp(64px,15svh,128px) 24px calc(var(--safe-b) + clamp(28px,5svh,44px));
}
.home__title{font-size:37px;line-height:1.12;letter-spacing:-.005em;max-width:9.6em;text-wrap:balance}
.home__zh{margin-top:12px;font-size:16.5px;font-weight:500;letter-spacing:.18em;text-indent:.18em;line-height:1.5}
.home__sub{margin-top:22px;font-size:14px;font-weight:300;letter-spacing:.14em;color:var(--ink-soft);line-height:1.7}
.start{
  margin-top:clamp(32px,6svh,48px);width:148px;height:48px;border:1px solid rgba(61,42,12,.45);
  font-family:var(--en);font-size:18px;letter-spacing:.2em;text-indent:.2em;color:var(--ink);
  transition:background-color .3s ease,color .3s ease;
}
.start:hover,.start:focus-visible{background:var(--ink);color:var(--bg)}
.home__note{margin-top:20px;font-size:10.5px;line-height:1.75;color:var(--ink-soft);display:flex;flex-direction:column}
.home__note span:last-child{letter-spacing:.12em}
.home__brand{margin-top:auto;padding-top:clamp(48px,11svh,120px);color:var(--clay)}
.home__brand p{font-size:12.5px;font-weight:300;letter-spacing:.14em;line-height:1.95}
.home__sign{margin:14px auto 0;width:236px;height:auto}

/* ---------- quiz ---------- */
.quiz{
  min-height:100vh;min-height:100svh;width:min(82vw,680px);margin:0 auto;
  padding:calc(var(--safe-t) + clamp(66px,10svh,88px)) 0 calc(var(--veil) + var(--safe-b) + 8px);
}
.quiz__bar{position:relative;display:flex;align-items:center;min-height:24px}
.quiz__back{font-size:12px;letter-spacing:.06em;color:var(--ink-mute);padding:4px 6px 4px 0;display:inline-flex;gap:6px;align-items:center;line-height:1.3}
.quiz__back:hover{color:var(--ink)}
.quiz__back svg{width:12px;height:8px}
.quiz__count{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--en);font-size:13px;letter-spacing:.2em;color:var(--ink-soft);line-height:1.3}
.quiz__q{
  margin:clamp(22px,5.5svh,60px) auto 0;max-width:15.5em;text-align:center;
  font-size:19px;line-height:1.5;letter-spacing:.06em;text-wrap:balance;
}
.opts{margin-top:24px;border-top:1px solid var(--line)}
.opt{
  width:100%;display:grid;grid-template-columns:18px 1fr 9px;gap:0 12px;align-items:center;
  text-align:left;padding:12px 6px 12px 4px;min-height:46px;
  border-bottom:1px solid var(--line);transition:background-color .25s ease;
}
.opt__key{font-family:var(--en);font-size:12px;color:var(--ink-mute);line-height:1.5}
.opt__text{font-size:14px;font-weight:300;line-height:1.5;letter-spacing:.04em;color:var(--ink)}
.opt__dot{width:8px;height:8px;border:1px solid var(--ink-mute);border-radius:50%;transition:background-color .2s ease,border-color .2s ease}
@media (hover:hover){.opt:hover{background:rgba(238,228,215,.45)}}
.opt[aria-pressed="true"] .opt__dot{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .opt__key{color:var(--ink)}
.quiz__hint{display:none;margin-top:18px;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--ink-mute)}
@media (hover:hover) and (pointer:fine) and (min-width:900px){.quiz__hint{display:block}}

/* ---------- result ---------- */
.result{width:min(78vw,720px);margin:0 auto;padding:0 0 calc(var(--veil) + var(--safe-b) + 36px);text-align:center}
/* 首屏：Hero + Today 佔約 70svh，內容垂直置中；推薦區從約 80% 的位置開始 */
.lead{min-height:70svh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 76px) 0 30px}
.hero__label{font-size:12px;letter-spacing:.22em;text-indent:.22em;color:var(--ink-soft);line-height:1.5}
.hero__en{margin-top:16px;font-family:var(--en);color:var(--tan-text);font-size:46px;line-height:1.02;letter-spacing:-.005em;text-wrap:balance}
.hero__zh{margin-top:10px;font-size:15px;letter-spacing:.22em;text-indent:.22em;color:var(--tan-text);line-height:1.5}
.hero__desc{margin:28px auto 0;max-width:30em;font-size:12.5px;font-weight:400;line-height:1.85;letter-spacing:.1em;color:var(--ink-soft)}
.today{margin-top:34px}
.today__h{font-family:var(--en);font-size:22px;color:var(--green);line-height:1.2}
.today__p{margin:10px auto 0;max-width:30em;font-size:12.5px;font-weight:400;line-height:1.85;letter-spacing:.1em;color:var(--green)}
.rule{height:1px;background:var(--ink);opacity:.4;border:0;margin:0 -3vw;width:auto}

.rec{margin-top:3.4svh}
.rec__h{font-size:14.5px;letter-spacing:.12em;line-height:1.6;color:var(--ink)}
.rec--new{margin-top:56px;padding-top:34px;border-top:1px solid var(--line)}
.rec--new .rec__h{color:var(--green)}
.card{margin-top:2.6svh;text-align:left}
.rec--new .card{margin-top:22px}
.card__fig{position:relative;background:var(--sand);aspect-ratio:1/1;max-height:360px;overflow:hidden;width:100%}
.card__ph{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:var(--clay)}
.card__fig img{position:relative;width:100%;height:100%;object-fit:cover}
.card__name{margin-top:20px;font-size:15px;line-height:1.7;letter-spacing:.12em;color:var(--ink)}
.card__notes{margin-top:8px;font-size:11.5px;line-height:1.7;letter-spacing:.12em;color:var(--tan-text)}
.card__copy{margin-top:12px;font-size:12.5px;font-weight:400;line-height:1.85;letter-spacing:.08em;color:var(--ink)}
.card__dev{margin-top:10px;font-size:12px;color:var(--red)}
.card__foot{margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-width:112px;height:42px;padding:0 20px;
  border:1px solid rgba(61,42,12,.5);font-size:13px;letter-spacing:.2em;text-indent:.2em;text-decoration:none;color:var(--ink);
  line-height:1;transition:background-color .3s ease,color .3s ease;
}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--bg)}

/* coupon：無底色、無外框，四角小字 + 置中內容 */
.coupon{margin:72px auto 0;max-width:460px}
.coupon__row{display:flex;justify-content:space-between;font-family:var(--en);font-size:10.5px;letter-spacing:.2em;color:var(--ink);line-height:1.4}
.coupon__in{padding:26px 0 30px}
.coupon__hello{font-family:var(--en);font-size:25px;color:var(--red);line-height:1.15;text-wrap:balance}
.coupon__offer{margin-top:10px;font-size:13px;letter-spacing:.12em;color:var(--ink-soft);line-height:1.6}
.coupon__use{margin-top:20px;font-family:var(--en);font-size:15px;color:var(--ink-soft);line-height:1.4}
.coupon__code{margin-top:6px;font-family:var(--en);font-size:22px;letter-spacing:.14em;text-indent:.14em;color:var(--red);line-height:1.3;user-select:all;-webkit-user-select:all}
.coupon__at{margin-top:6px;font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft);line-height:1.6}
.coupon__acts{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.coupon .btn{height:46px;min-width:196px;font-size:13px}
.coupon__shop{font-size:12.5px;letter-spacing:.12em;color:var(--ink-soft);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;padding:2px}
.coupon__shop:hover{color:var(--ink)}
.end{margin-top:64px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em}
.end a,.end button{color:var(--ink-mute);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;padding:4px;line-height:1.5}
.end a:hover,.end button:hover{color:var(--ink)}

.dev{margin:30px auto 0;text-align:left;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--ink-soft);border:1px dashed var(--line);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}

/* hero reveal */
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.reveal{opacity:0;animation:rise .8s cubic-bezier(.22,.61,.36,1) forwards;animation-delay:calc(var(--i) * 120ms + 300ms)}

/* ---------- small phones ---------- */
@media (max-width:359px){
  .quiz{width:86vw;padding-top:calc(var(--safe-t) + 58px)}
  .quiz__q{font-size:17px;margin-top:18px}
  .opts{margin-top:16px}
  .opt{padding-top:9px;padding-bottom:9px;min-height:40px;gap:0 9px}
  .opt__text{font-size:13px}
  .home{padding-top:44px;padding-bottom:calc(var(--safe-b) + 20px)}
  .home__title{font-size:34px}
  .home__brand{padding-top:28px}
  .start{margin-top:26px}
  .home__sub{letter-spacing:.08em;font-size:13px}
  .result{width:82vw}
  .lead{padding-top:calc(var(--safe-t) + 64px);padding-bottom:22px}
  .hero__en{font-size:40px}
  .hero__desc{margin-top:20px}.today{margin-top:24px}
}

/* ---------- tablet / desktop ---------- */
@media (min-width:768px){
  :root{--veil:76px}
  .close{top:30px;right:40px;font-size:13px}
  .sound{top:22px;left:30px}
  .logo{width:136px;bottom:calc(var(--safe-b) + 20px)}

  .home{padding-top:clamp(84px,15svh,150px)}
  .home__title{font-size:50px;max-width:none}
  .home__zh{margin-top:14px;font-size:19px}
  .home__sub{margin-top:26px;font-size:16px}
  .start{margin-top:clamp(40px,6.5svh,60px);width:176px;height:54px;font-size:20px}
  .home__note{margin-top:24px;font-size:11.5px}
  .home__brand p{font-size:13.5px;line-height:2}
  .home__sign{width:300px;margin-top:16px}

  .quiz{padding-top:clamp(72px,12svh,128px)}
  .quiz__back{font-size:13px}
  .quiz__count{font-size:14px}
  .quiz__q{font-size:24px;line-height:1.55;letter-spacing:.08em;margin-top:clamp(40px,8svh,84px)}
  .opts{margin-top:30px}
  .opt{grid-template-columns:26px 1fr 9px;gap:0 16px;padding:15px 14px 15px 10px;min-height:54px}
  .opt__key{font-size:13px}
  .opt__text{font-size:15.5px;letter-spacing:.05em}

  .lead{padding-top:92px;padding-bottom:40px}
  .hero__label{font-size:13.5px}
  .hero__en{margin-top:22px;font-size:62px;max-width:6.4em;margin-left:auto;margin-right:auto}
  .hero__zh{margin-top:14px;font-size:18px}
  .hero__desc{margin-top:34px;font-size:14px;line-height:1.9;max-width:36em}
  .today{margin-top:40px}
  .today__h{font-size:27px}
  .today__p{margin-top:12px;font-size:14px;line-height:1.9;max-width:36em}
  .rule{margin:0 auto;width:86%}
  .rec__h{font-size:17px}
  .rec--new{margin-top:84px;padding-top:48px}
  .card{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:44px;align-items:start}
  .rec--new .card{margin-top:30px}
  .card__fig{max-height:340px}
  .card__body{padding-top:8px}
  .card__name{margin-top:0;font-size:18px;line-height:1.7}
  .card__notes{margin-top:10px;font-size:13px}
  .card__copy{margin-top:16px;font-size:14px;line-height:1.9}
  .card__foot{margin-top:26px}
  .btn{font-size:14px;height:46px;min-width:136px}
  .coupon{margin-top:110px}
  .coupon__row{font-size:11.5px}
  .coupon__in{padding:36px 0 40px}
  .coupon__hello{font-size:30px}
  .coupon__offer{font-size:14px}
  .coupon__use{margin-top:24px;font-size:16px}
  .coupon__code{font-size:22px}
  .coupon__at{font-size:13.5px}
  .coupon .btn{font-size:14px;min-width:220px;height:50px}
  .end{margin-top:84px;flex-direction:row;justify-content:center;gap:30px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .screen{transition:none}
  .reveal{animation:none;opacity:1}
  *{scroll-behavior:auto!important}
}
</style>
</head>
<body data-screen="home">

<a class="close" id="close" href="https://its-saturday.com/"></a>

<button class="sound" id="sound" type="button" aria-pressed="false" hidden>
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 7.8h2.6L9.4 4.6v10.8L5.6 12.2H3z"/>
    <g class="sound__on"><path d="M12.2 7.6a3.4 3.4 0 010 4.8M14.4 5.6a6.2 6.2 0 010 8.8"/></g>
    <g class="sound__off"><path d="M12.6 7.8l4 4.4M16.6 7.8l-4 4.4"/></g>
  </svg>
</button>

<main id="app" class="screen" aria-live="polite"></main>

<div class="veil" aria-hidden="true"></div>
<div class="logo" aria-hidden="true"><img id="logoImg" alt="" width="415" height="79"></div>

<script>
/* ==================================================================
   It’s Saturday! — What do you need right now?
   全部品牌資料集中在這個區塊。修改文案、商品、圖片、網址、折扣碼，
   只需要改下面的 BRAND / QUESTIONS / RESULTS / OLD_PRODUCTS /
   NEW_PRODUCTS / COUPON，不需要動下方的程式。
   ================================================================== */
/* ==LOGIC-START== */
var BRAND = {
  name: "It’s Saturday!",
  siteUrl: "https://its-saturday.com/",
  closeLabel: "回到 It’s Saturday 官網",
  home: {
    titleEn: "What do you need right now?",
    titleZh: "現在的你，需要什麼？",
    sub: "花兩分鐘，看看最近的生活需要什麼吧。",
    start: "START",
    disclaimerEn: "This is a self-reflection experience, not a psychological assessment.",
    disclaimerZh: "這是一次自我反思的體驗，而非心理評估。",
    quote: ["「外向是生活所需，獨處是自我享受。」", "你有多久，沒有給自己一個蠟燭的時間？", "在這邊，我們陪著你練習好好休息。"],
    signature: "— Abby, Founder of It’s Saturday!"
  },
  /* 背景音樂：把 src 換成音檔網址（mp3 / m4a）就會啟用；留空＝沒有音樂、也不顯示左上角按鈕。 */
  music: { src: "", volume: 0.45, onLabel: "關閉音樂", offLabel: "開啟音樂" },
  quiz: { backToStart: "回到開始", prev: "上一題", keyHint: "可以用鍵盤 A–E 或 1–5 作答" },
  result: {
    labelZh: "你現在需要的是",
    todayHeading: "Today, try this",
    oldHeading: "給你推薦的 It’s Saturday! 熟客款式",
    newHeading: "Doing Nothing 系列｜新品推薦",
    productCta: "查看商品",
    imagePlaceholder: "商品圖片",
    backToSite: "回到 It’s Saturday! 官網",
    restart: "重新測驗"
  }
};

var NEEDS = ["SLOW", "SAFE", "FOCUS", "FEEL", "AWAY"];

/* Q1–Q7：need 的順序＝同一個選項內的優先順序。Q8、Q9 不影響 Need。 */
var QUESTIONS = [
  { id: "Q1", text: "如果明天突然沒有任何事情需要完成，你第一個想做什麼？", options: [
    { text: "睡到自然醒，慢慢吃早餐。", need: [["SLOW", 2]] },
    { text: "把桌面整理乾淨，完成一件拖很久的小事。", need: [["FOCUS", 2]] },
    { text: "待在熟悉的家裡，做一直很喜歡的事情。", need: [["SAFE", 2]] },
    { text: "去一個沒去過的地方走走。", need: [["AWAY", 2]] },
    { text: "我不知道。我好像很久沒有想過自己想做什麼。", need: [["FEEL", 2], ["SLOW", 1]] }
  ]},
  { id: "Q2", text: "最近回到家，你比較常是哪一種狀態？", options: [
    { text: "身體很累，但腦袋還停不下來。", need: [["SLOW", 2]] },
    { text: "一直想著還有哪些事情沒有處理。", need: [["FOCUS", 2]] },
    { text: "只想回到一個不用應付任何人的地方。", need: [["SAFE", 2]] },
    { text: "日子都差不多，沒有特別期待什麼。", need: [["FEEL", 2]] },
    { text: "很想直接訂一張車票離開幾天。", need: [["AWAY", 2]] }
  ]},
  { id: "Q3", text: "現在給你兩個小時，你最想待在哪裡？", options: [
    { text: "有陽光、乾淨棉被的床上。", need: [["SLOW", 2]] },
    { text: "木頭很多、安靜又熟悉的小房間。", need: [["SAFE", 2]] },

/* ------------------------------------------------------------------
   推薦邏輯（純函式，沒有 random、沒有任何網路呼叫）
   ------------------------------------------------------------------ */
var SCORING = {
  primaryOnProductPrimary: 6, primaryOnProductSecondary: 4, primaryOnProductTertiary: 4,
  secondaryOnProductPrimary: 3, secondaryOnProductSecondary: 1, secondaryOnProductTertiary: 1,
  scentTagEach: 1, scentTagMax: 2, intensityMatch: 1, formatMatch: 1.5
};

function tagsOf(product) {
  if (product.scentTags) return product.scentTags;
  var seen = {}, out = [];
  product.scentElements.forEach(function (el) {
    (ELEMENT_TAGS[el] || []).forEach(function (t) { if (!seen[t]) { seen[t] = 1; out.push(t); } });
  });
  product.scentTags = out;
  return out;
}

/* answers: [Q1..Q9] 的選項 index。每次都從完整 answers 重新計算。 */
function computeProfile(answers) {
  var score = {}, recency = {};
  NEEDS.forEach(function (n) { score[n] = 0; recency[n] = -1; });
  for (var q = 0; q < 7; q++) {
    var opt = QUESTIONS[q].options[answers[q]];
    opt.need.forEach(function (pair, pos) {
      score[pair[0]] += pair[1];
      recency[pair[0]] = q * 10 + (9 - pos);   // 越後面的題目越大；同一選項內，先列出的 Need 優先
    });
  }
  var ranked = NEEDS.slice().sort(function (a, b) {
    return (score[b] - score[a]) || (recency[b] - recency[a]) || (NEEDS.indexOf(a) - NEEDS.indexOf(b));
  });
  var q8 = QUESTIONS[7].options[answers[7]], q9 = QUESTIONS[8].options[answers[8]];
  return {
    scores: score,
    primaryNeed: ranked[0],
    secondaryNeed: score[ranked[1]] > 0 ? ranked[1] : null,   // 第二名 0 分時不設 secondary
    intensity: q8.intensity,
    preferenceTags: q8.preferenceTags,
    preferredFormat: q9.preferredFormat
  };
}

function hasVariant(product, type) {
  return product.variants.some(function (v) { return v.type === type; });
}

function scoreProduct(product, profile, isNew) {
  var S = SCORING, P = profile.primaryNeed, Q = profile.secondaryNeed;
  var tert = isNew ? (product.supportedTertiaryNeeds || []) : [];
  var needP = 0, needS = 0;
  if (product.primaryNeed === P) needP += S.primaryOnProductPrimary;
  if (product.secondaryNeed === P) needP += S.primaryOnProductSecondary;
  if (tert.indexOf(P) > -1) needP += S.primaryOnProductTertiary;
  if (Q) {
    if (product.primaryNeed === Q) needS += S.secondaryOnProductPrimary;
    if (product.secondaryNeed === Q) needS += S.secondaryOnProductSecondary;
    if (tert.indexOf(Q) > -1) needS += S.secondaryOnProductTertiary;
  }
  var tags = tagsOf(product), matches = 0;
  profile.preferenceTags.forEach(function (t) { if (tags.indexOf(t) > -1) matches++; });
  var scent = Math.min(S.scentTagMax, matches * S.scentTagEach) + (product.intensity === profile.intensity ? S.intensityMatch : 0);
  var fmt = 0;
  if (isNew && profile.preferredFormat !== "both" && hasVariant(product, profile.preferredFormat)) fmt = S.formatMatch;
  return { product: product, total: needP + needS + scent + fmt, needP: needP, needS: needS, scent: scent, format: fmt };
}

function rank(pool, profile, isNew) {
  return pool.map(function (p, i) { var s = scoreProduct(p, profile, isNew); s.order = i; return s; })
    .sort(function (a, b) {
      return (b.total - a.total) || (b.needP - a.needP) || (b.needS - a.needS) ||
             (b.scent - a.scent) || (b.format - a.format) || (a.order - b.order);
    });
}

/* 先選香氣，再自動選一個 final variant（candle / diffuser / both→candle；沒有該款式就用蠟燭）。 */
function pickVariant(product, preferredFormat) {
  var want = preferredFormat === "diffuser" ? "diffuser" : "candle";
  for (var i = 0; i < product.variants.length; i++) if (product.variants[i].type === want) return product.variants[i];
  return product.variants[0];
}

/* primary copy → secondary copy → null（不生成、不借用其他 Need 的文案） */
function pickCopy(product, profile) {
  var c = product.recommendationCopy || {};
  if (c[profile.primaryNeed]) return { need: profile.primaryNeed, text: c[profile.primaryNeed] };
  if (profile.secondaryNeed && c[profile.secondaryNeed]) return { need: profile.secondaryNeed, text: c[profile.secondaryNeed] };
  return null;
}

function recommend(answers) {
  var profile = computeProfile(answers);
  var oldRank = rank(OLD_PRODUCTS, profile, false), newRank = rank(NEW_PRODUCTS, profile, true);
  var oldP = oldRank[0].product, newP = newRank[0].product;
  return {
    profile: profile,
    old: { product: oldP, variant: pickVariant(oldP, "candle"), copy: pickCopy(oldP, profile), ranking: oldRank },
    fresh: { product: newP, variant: pickVariant(newP, profile.preferredFormat), copy: pickCopy(newP, profile), ranking: newRank }
  };
}

      if (!ok) return;
      var cq = Math.max(-1, Math.min(total, s.currentQuestion | 0));
      if (cq > s.answers.length) cq = s.answers.length;
      if (cq === total && s.answers.length < total) cq = s.answers.length;
      state = { answers: s.answers, currentQuestion: cq };
    } catch (e) {}
  }

  var CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;
  var LATIN = /[A-Za-z0-9$][A-Za-z0-9$ .,'’!?&:\-–]*[A-Za-z0-9.!?]|[A-Za-z0-9]/g;
  /* 英文一律 Faculty Glyphic（.en），中文一律 --zh：混排字串把英數片段包成 <span class="en">。 */
  function setText(n, text) {
    text = String(text);
    if (!/[A-Za-z0-9]/.test(text)) { n.textContent = text; return; }
    if (!CJK.test(text)) { n.textContent = text; n.classList.add("en"); return; }
    var last = 0, m;
    LATIN.lastIndex = 0;
    while ((m = LATIN.exec(text))) {
      if (m.index > last) n.appendChild(document.createTextNode(text.slice(last, m.index)));
      var s = document.createElement("span"); s.className = "en"; s.textContent = m[0];
      n.appendChild(s);
      last = m.index + m[0].length;
    }
    if (last < text.length) n.appendChild(document.createTextNode(text.slice(last)));
  }
  function setText2(n, text) { n.textContent = ""; n.classList.remove("en"); setText(n, text); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) setText(n, text);
    return n;
  }
  setText(closeEl, BRAND.closeLabel);
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function show(build, name) {
    if (busy) return;
    busy = true;
    var swap = function () {
      app.innerHTML = "";
      document.body.setAttribute("data-screen", name);
      app.appendChild(build());
      window.scrollTo(0, 0);
      app.classList.remove("is-leaving");
      app.classList.add("is-entering");
      void app.offsetWidth;
      app.classList.remove("is-entering");
      var h = app.querySelector("[data-focus]");
      if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
      busy = false;
    };
    if (reduce || !app.firstChild) { swap(); return; }
    app.classList.add("is-leaving");
    setTimeout(swap, FADE);
  }

  function go(n) {
    state.currentQuestion = n;
    save();
    if (n < 0) show(buildHome, "home");
    else if (n >= total) show(buildResult, "result");
    else show(function () { return buildQuestion(n); }, "quiz");
  }

  /* ---------- home ---------- */
  function buildHome() {
    var H = BRAND.home, s = el("section", "home");
    var h = el("h1", "home__title", H.titleEn); h.tabIndex = -1; h.setAttribute("data-focus", "");
    s.appendChild(h);
    s.appendChild(el("p", "home__zh", H.titleZh));
    s.appendChild(el("p", "home__sub", H.sub));
    var b = el("button", "start", H.start); b.type = "button";
    b.addEventListener("click", function () { state.answers = []; startMusic(); go(0); });
    s.appendChild(b);
    var note = el("p", "home__note");
    note.appendChild(el("span", "", H.disclaimerEn));
    note.appendChild(el("span", "", H.disclaimerZh));
    s.appendChild(note);
    var brand = el("div", "home__brand");
    H.quote.forEach(function (line) { brand.appendChild(el("p", "", line)); });
    var sign = el("img", "home__sign"); sign.src = SIGN_SRC; sign.alt = H.signature; sign.width = 892; sign.height = 66;
    brand.appendChild(sign);
    s.appendChild(brand);
    return s;
  }

  /* ---------- quiz ---------- */
  function buildQuestion(n) {
    var q = QUESTIONS[n], s = el("section", "quiz");
    var bar = el("div", "quiz__bar");
    var back = el("button", "quiz__back"); back.type = "button";
    back.innerHTML = '<svg viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M15.5 5H1M5 1L1 5l4 4"/></svg>';
    back.appendChild(el("span", "", n === 0 ? BRAND.quiz.backToStart : BRAND.quiz.prev));
    back.addEventListener("click", function () { go(n - 1); });
    bar.appendChild(back);
    var count = el("p", "quiz__count", pad(n + 1) + " / " + pad(total));
    count.setAttribute("aria-label", "第 " + (n + 1) + " 題，共 " + total + " 題");
    bar.appendChild(count);
    s.appendChild(bar);
    var h = el("h1", "quiz__q", q.text); h.tabIndex = -1; h.setAttribute("data-focus", "");
    s.appendChild(h);
    var list = el("ul", "opts");
    q.options.forEach(function (o, i) {
      var li = el("li"), b = el("button", "opt"); b.type = "button";
      b.setAttribute("aria-pressed", state.answers[n] === i ? "true" : "false");
      b.setAttribute("data-i", i);
      b.appendChild(el("span", "opt__key", String.fromCharCode(65 + i)));
      b.appendChild(el("span", "opt__text", o.text));
      var d = el("span", "opt__dot"); d.setAttribute("aria-hidden", "true"); b.appendChild(d);
      b.addEventListener("click", function () { answer(n, i, list); });
      li.appendChild(b); list.appendChild(li);
    });
    s.appendChild(list);
    s.appendChild(el("p", "quiz__hint", BRAND.quiz.keyHint.replace("A–E", "A–" + String.fromCharCode(64 + q.options.length)).replace("1–5", "1–" + q.options.length)));
    return s;
  }

  function answer(n, i, list) {
    if (busy) return;
    state.answers[n] = i;
    if (list) Array.prototype.forEach.call(list.querySelectorAll(".opt"), function (b, k) {
      b.setAttribute("aria-pressed", k === i ? "true" : "false");
    });
    go(n + 1);
  }

  document.addEventListener("keydown", function (e) {
    if (busy || e.metaKey || e.ctrlKey || e.altKey) return;
    var n = state.currentQuestion;
    if (n < 0 || n >= total) return;
    var k = e.key.toUpperCase(), i = -1;
    if (k.length === 1 && k >= "A" && k <= "E") i = k.charCodeAt(0) - 65;
    else if (k.length === 1 && k >= "1" && k <= "5") i = +k - 1;
    if (i < 0 || !QUESTIONS[n].options[i]) return;
    e.preventDefault();
    answer(n, i, app.querySelector(".opts"));
  });

  /* ---------- result ---------- */
  /* 每張商品卡只顯示一個 final variant：officialName / imageUrl / productUrl 都取自同一個 variant。 */
  function buildCard(rec) {
    var R = BRAND.result, p = rec.product, v = rec.variant;
    var card = el("article", "card");
    var fig = el("figure", "card__fig");
    var ph = el("span", "card__ph", R.imagePlaceholder); ph.setAttribute("aria-hidden", "true");
    fig.appendChild(ph);
    if (v.imageUrl) {
      var img = el("img");
      img.decoding = "async"; img.alt = v.officialName;
      img.addEventListener("error", function () { img.hidden = true; });   // 圖片失敗：保留同比例的 placeholder
      img.src = v.imageUrl;
      fig.appendChild(img);
    }
    var body = el("div", "card__body");
    body.appendChild(el("h3", "card__name", v.officialName));
    if (p.scentElements && p.scentElements.length) body.appendChild(el("p", "card__notes", p.scentElements.join("・")));
    if (rec.copy) body.appendChild(el("p", "card__copy", rec.copy.text));
    else if (DEV) body.appendChild(el("p", "card__dev", "［推薦文案待品牌補入］"));
    var foot = el("div", "card__foot");
    var cta = el("a", "btn", R.productCta);
    cta.href = v.productUrl;
    cta.setAttribute("aria-label", R.productCta + "：" + v.officialName);
    foot.appendChild(cta);
    body.appendChild(foot);
    card.appendChild(fig); card.appendChild(body);
    return card;
  }

  function buildResult() {
    var R = BRAND.result, out = recommend(state.answers), res = RESULTS[out.profile.primaryNeed];
    var s = el("section", "result");
    function rise(node, i) { node.classList.add("reveal"); node.style.setProperty("--i", i); return node; }

    var hero = el("header", "hero");
    hero.appendChild(rise(el("p", "hero__label", R.labelZh), 0));
    var h = rise(el("h1", "hero__en", res.en), 1); h.tabIndex = -1; h.setAttribute("data-focus", ""); h.lang = "en";
    hero.appendChild(h);
    hero.appendChild(rise(el("p", "hero__zh", res.zh), 2));
    hero.appendChild(rise(el("p", "hero__desc", res.desc), 3));
    var lead = el("div", "lead");
    lead.appendChild(hero);

    var today = rise(el("section", "today"), 4);
    var th = el("h2", "today__h", R.todayHeading); th.lang = "en";
    today.appendChild(th);
    today.appendChild(el("p", "today__p", res.action));
    lead.appendChild(today);
    s.appendChild(lead);
    s.appendChild(el("hr", "rule"));

    var a = el("section", "rec rec--old");
    a.appendChild(el("h2", "rec__h", R.oldHeading));
    a.appendChild(buildCard(out.old));
    s.appendChild(a);

    var b = el("section", "rec rec--new");
    b.appendChild(el("h2", "rec__h", R.newHeading));
    b.appendChild(buildCard(out.fresh));
    s.appendChild(b);

    s.appendChild(buildCoupon());

    var end = el("nav", "end"); end.setAttribute("aria-label", "結束");
    var site = el("a", "", R.backToSite); site.href = BRAND.siteUrl;
    var again = el("button", "", R.restart); again.type = "button";
    again.addEventListener("click", function () { state = { answers: [], currentQuestion: -1 }; clear(); show(buildHome, "home"); });
    end.appendChild(site); end.appendChild(again);
    s.appendChild(end);

    if (DEV) {
      var line = function (r) { return r.product.scentName + " " + r.total + " (P" + r.needP + " S" + r.needS + " scent" + r.scent + " fmt" + r.format + ")"; };
      s.appendChild(el("pre", "dev",
        "answers " + state.answers.map(function (x) { return String.fromCharCode(65 + x); }).join("") +
        "\nscores " + JSON.stringify(out.profile.scores) +
        "\nprimary " + out.profile.primaryNeed + " / secondary " + out.profile.secondaryNeed +
        "\nQ8 " + out.profile.intensity + " [" + out.profile.preferenceTags + "] / Q9 " + out.profile.preferredFormat +
        "\ncopy old=" + (out.old.copy ? out.old.copy.need : "none") + " new=" + (out.fresh.copy ? out.fresh.copy.need : "none") +
        "\nOLD\n  " + out.old.ranking.map(line).join("\n  ") + "\nNEW\n  " + out.fresh.ranking.map(line).join("\n  ")));
    }
    return s;
  }

  function buildCoupon() {
    var c = el("aside", "coupon"); c.setAttribute("aria-label", "折扣碼");
    var K = COUPON.corners || [];
    function corners(a, b) { var r = el("div", "coupon__row"); r.setAttribute("aria-hidden", "true"); r.appendChild(el("span", "", a)); r.appendChild(el("span", "", b)); return r; }
    if (K.length === 4) c.appendChild(corners(K[0], K[1]));
    var inner = el("div", "coupon__in");
    var g = el("p", "coupon__hello", COUPON.greeting); g.lang = "en";
    inner.appendChild(g);
    inner.appendChild(el("p", "coupon__offer", COUPON.offer));
    var u = el("p", "coupon__use", COUPON.useLabel); u.lang = "en";
    inner.appendChild(u);
    inner.appendChild(el("p", "coupon__code", COUPON.code));
    if (COUPON.checkoutNote) inner.appendChild(el("p", "coupon__at", COUPON.checkoutNote));
    var acts = el("div", "coupon__acts");
    var copy = el("button", "btn", COUPON.copyLabel); copy.type = "button";
    var live = el("span", "sr-only"); live.setAttribute("aria-live", "polite"); live.setAttribute("role", "status");
    var timer;
    function done() {
      setText2(copy, COUPON.copiedLabel); live.textContent = COUPON.copiedLabel;
      clearTimeout(timer);
      timer = setTimeout(function () { setText2(copy, COUPON.copyLabel); live.textContent = ""; }, 1800);
    }
    function legacy() {
      var t = document.createElement("textarea");
      t.value = COUPON.code; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t);
      if (ok) done();
    }
    copy.addEventListener("click", function () {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(COUPON.code).then(done, legacy);
      else legacy();
    });
    var shop = el("a", "coupon__shop", COUPON.shopLabel); shop.href = COUPON.shopUrl;
    acts.appendChild(copy); acts.appendChild(shop);
    inner.appendChild(acts); inner.appendChild(live);
    c.appendChild(inner);
    if (K.length === 4) c.appendChild(corners(K[2], K[3]));
    return c;
  }

  /* ---------- boot ---------- */
  load();
  if (audio && !soundOff && state.currentQuestion >= 0) startMusic();
  var n = state.currentQuestion;
  if (n < 0) show(buildHome, "home");
  else if (n >= total) show(buildResult, "result");
  else show(function () { return buildQuestion(n); }, "quiz");
})();
</script>
</body>
</html>
